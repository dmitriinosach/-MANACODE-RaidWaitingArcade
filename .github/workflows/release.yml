name: Release

# Тег v* — раздача: архив собирается, уезжает на CurseForge и в GitHub Releases.
# «beta» или «alpha» в имени тега packager сам превращает в тип файла.
# Ручной запуск (Actions → Release → Run workflow) — пробная сборка без загрузки.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
      GAME_VERSION: ${{ secrets.GAME_VERSION }}
    steps:
      - uses: actions/checkout@v4
        if: env.CF_PROJECT_ID != ''
        with:
          fetch-depth: 0

      # Версия игры задана явно: базовый .toc несёт 30300 (приватные 3.3.5a), а
      # _Camelot — 16001. CurseForge таких не знает, и автоопределение по .toc
      # пометило бы файл чужими версиями. Значения — в Settings → Secrets.
      - uses: BigWigsMods/packager@v2
        if: env.CF_PROJECT_ID != ''
        with:
          args: ${{ github.event_name == 'workflow_dispatch' && '-d' || '' }} -p ${{ secrets.CF_PROJECT_ID }} -g "${{ secrets.GAME_VERSION }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
